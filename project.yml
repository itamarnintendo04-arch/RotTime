# XcodeGen spec — the Xcode project is generated from this file (locally or in CI):
#   brew install xcodegen && xcodegen generate
#
# Bundle identifiers and the App Group are build settings so you can point them at your
# own Apple Developer team without touching code:
#   xcodebuild ... RT_BUNDLE_ID=com.yourname.rottime RT_APP_GROUP=group.com.yourname.rottime
name: RotTime
options:
  bundleIdPrefix: com.rottime
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # ---- RotTime identity (override on the xcodebuild command line) ----
    RT_BUNDLE_ID: com.rottime.app
    RT_APP_GROUP: group.com.rottime.app
    # ---- Manual-signing profile names (set by CI when signing secrets exist) ----
    RT_PROFILE_APP: ""
    RT_PROFILE_MONITOR: ""
    RT_PROFILE_SHIELD_CONFIG: ""
    RT_PROFILE_SHIELD_ACTION: ""
    RT_PROFILE_REPORT: ""

targets:
  RotTime:
    type: application
    platform: iOS
    sources:
      - path: RotTime
        excludes:
          - Info.plist
          - RotTime.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: RotTime
        PRODUCT_BUNDLE_IDENTIFIER: $(RT_BUNDLE_ID)
        INFOPLIST_FILE: RotTime/Info.plist
        CODE_SIGN_ENTITLEMENTS: RotTime/RotTime.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(RT_PROFILE_APP)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: RotTimeMonitor
      - target: RotTimeShieldConfiguration
      - target: RotTimeShieldAction
      - target: RotTimeReport
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework

  RotTimeMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitor
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: RotTimeMonitor
        PRODUCT_BUNDLE_IDENTIFIER: $(RT_BUNDLE_ID).monitor
        INFOPLIST_FILE: Extensions/DeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/DeviceActivityMonitor/RotTimeMonitor.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(RT_PROFILE_MONITOR)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework

  RotTimeShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: RotTimeShieldConfiguration
        PRODUCT_BUNDLE_IDENTIFIER: $(RT_BUNDLE_ID).shieldconfig
        INFOPLIST_FILE: Extensions/ShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldConfiguration/RotTimeShieldConfiguration.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(RT_PROFILE_SHIELD_CONFIG)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ManagedSettingsUI.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework

  RotTimeShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: RotTimeShieldAction
        PRODUCT_BUNDLE_IDENTIFIER: $(RT_BUNDLE_ID).shieldaction
        INFOPLIST_FILE: Extensions/ShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldAction/RotTimeShieldAction.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(RT_PROFILE_SHIELD_ACTION)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework

  RotTimeReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Extensions/ActivityReport
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: RotTimeReport
        PRODUCT_BUNDLE_IDENTIFIER: $(RT_BUNDLE_ID).report
        INFOPLIST_FILE: Extensions/ActivityReport/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ActivityReport/RotTimeReport.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(RT_PROFILE_REPORT)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: DeviceActivity.framework

  RotTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RotTimeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RT_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RotTime.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RotTime
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: RotTime

schemes:
  RotTime:
    build:
      targets:
        RotTime: all
        RotTimeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RotTimeTests
    archive:
      config: Release
